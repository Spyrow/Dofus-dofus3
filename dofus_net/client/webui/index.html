<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dofus – Comptes</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--fg:#26231d;--mut:#7a7466;--line:#e3dfd3;--acc:#2f7d4f;--bad:#b3392b}
@media(prefers-color-scheme:dark){:root{--bg:#171613;--card:#211f1b;--fg:#ece8dc;--mut:#9a9484;--line:#363229;--acc:#5fb583;--bad:#e0705f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:16px}main{padding:24px;max-width:1000px}
h1{font-size:17px;margin:0 0 12px}h2{font-size:15px;margin:0 0 10px}
.acc{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.acc:hover{background:var(--card)}.acc.sel{background:var(--card);border-color:var(--line)}
.acc small{color:var(--mut);display:block}
button{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--bad)}button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.row span:first-child{color:var(--mut)}
.slot{padding:8px 0;border-bottom:1px dashed var(--line)}.slot:last-child{border:0}.slot em{color:var(--mut)}
.stats{color:var(--mut);font-size:13px}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.top h1{flex:1;margin:0;font-size:22px}.msg{color:var(--mut)}.err{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:6px 8px;border-bottom:1px dashed var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:13px}.n{text-align:right}
input{font:inherit;width:100%;max-width:320px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
td input,td select{max-width:none;width:100%;min-width:56px}td input[type=number]{width:70px}select{font:inherit;padding:5px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.log li{margin:2px 0}.log .mv{color:var(--mut)}.hint{font-size:13px;color:var(--mut)}
.mapwrap{overflow-x:auto;outline:none}.mapg{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);width:max-content}
.mc{width:38px;height:30px;background:var(--card);font-size:10px;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.mc.k{background:color-mix(in srgb,var(--acc) 18%,var(--card))}.mc.t{background:color-mix(in srgb,var(--acc) 38%,var(--card))}.mc.o{cursor:default}
.mc.me{background:var(--acc);color:#fff;font-weight:700}.mc.sel{outline:2px solid var(--fg);outline-offset:-2px}.mc.ax{background:var(--bg);cursor:default;font-size:11px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut)}
.badge.connected{color:var(--acc);border-color:var(--acc)}.badge.connecting{color:#b8860b;border-color:#b8860b}.badge.error{color:var(--bad);border-color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}.dot.connected{background:var(--acc)}.dot.connecting{background:#b8860b}.dot.error{background:var(--bad)}
.cons{font:12.5px/1.5 ui-monospace,Consolas,monospace;height:340px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cons div{white-space:pre-wrap;word-break:break-word}.cons .t{color:var(--mut)}.cons .warn{color:#b8860b}.cons .error{color:var(--bad)}.cons .action{color:var(--acc)}.cons .event{font-weight:600}
.mapnav{display:grid;grid-template-columns:auto minmax(0,auto) auto;gap:8px;justify-content:center;align-items:center}
.mapnav canvas{width:100%;max-width:640px;height:auto;display:block;cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.mapnav .side{min-width:44px;padding:8px 10px;font-size:15px;line-height:1.15;text-align:center}
.mapnav .side small{display:block;font-size:11px;color:var(--mut)}.mapnav .side:disabled small{color:inherit}
@media(max-width:700px){.app{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<div class="app">
<aside>
  <h1>Comptes</h1>
  <div id="list"></div>
  <p><button class="p" id="add">+ Connecter un compte</button></p>
  <p class="msg" id="loginmsg"></p>
</aside>
<main id="main"><p class="msg">Sélectionne un compte.</p></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?new Date(t*1000).toLocaleString("fr-FR"):"—";
async function api(path,method="GET",body){
  const r=await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch{}
  if(!r.ok)throw Object.assign(new Error(j?.error||r.statusText),{status:r.status});
  return j;
}
let accts=[],sel=null,tab="fiche",invQ="";
try{sel=localStorage.getItem("sel");tab=localStorage.getItem("tab")||"fiche"}catch{}

async function loadList(soft){
  accts=await api("/api/accounts");
  if(!accts.find(a=>a.id===sel))sel=accts[0]?.id||null;
  $("#list").innerHTML=accts.map(a=>`<div class="acc ${a.id===sel?"sel":""}" data-id="${esc(a.id)}"><div>${esc(a.label)}<small>${a.demo?"exemple":"MAJ jeton : "+fmt(a.refreshed)}</small>${a.demo?"":`<small class="ss"><span class="dot ${a.session||"disconnected"}"></span>${STL[a.session||"disconnected"]}</small>`}</div></div>`).join("");
  document.querySelectorAll(".acc").forEach(e=>e.onclick=()=>{sel=e.dataset.id;try{localStorage.setItem("sel",sel)}catch{};loadList()});
  if(soft&&LIVE_TABS.has(tab)&&$("#char .tabs"))return;   // live tabs (journal, map, quests...) poll by themselves: re-rendering them on every disk change made the console jump
  render();
}
const LIVE_TABS=new Set(["console","map","quests","combat"]);

async function render(){
  const a=accts.find(x=>x.id===sel),m=$("#main");
  if(!a){m.innerHTML='<p class="msg">Aucun compte. Clique sur « Connecter un compte ».</p>';return}
  m.innerHTML=`<div class="top"><h1>${esc(a.label)}</h1>
    ${a.demo?"":'<span class="badge" id="st"></span><button class="p" id="con">Connecter le personnage</button><button id="ren">Renommer</button><button id="ref">Rafraîchir le jeton</button><button class="d" id="del">Supprimer</button>'}</div>
    <p class="msg err" id="acterr"></p><p class="msg" id="conmsg"></p><div id="char"><p class="msg">Chargement…</p></div>`;
  if(!a.demo){
    $("#con").onclick=()=>toggleSession(a);
    $("#ren").onclick=async()=>{const l=prompt("Nouveau nom",a.label);if(l)await act(()=>api(`/api/accounts/${a.id}/rename`,"POST",{label:l}))};
    $("#ref").onclick=async e=>{e.target.disabled=true;await act(()=>api(`/api/accounts/${a.id}/refresh`,"POST",{}))};
    $("#del").onclick=async()=>{if(confirm(`Supprimer « ${a.label} » ? Les jetons enregistrés seront effacés.`))await act(()=>api(`/api/accounts/${a.id}`,"DELETE"))};
  }
  paintStatus();
  let d;
  try{d=await api(`/api/accounts/${a.id}/character`)}
  catch(e){
    $("#char").innerHTML=e.status===404
      ?`<div class="card"><h2>Pas encore de données de personnage</h2><p class="msg">Le compte est enregistré, mais le personnage n'a pas encore été récupéré. Ferme le jeu, puis clique sur « Connecter le personnage » : une session de jeu s'ouvre, le serveur envoie les caractéristiques, elles s'affichent ici. Le compte « Démo » montre le rendu complet.</p></div>`
      :`<p class="err">${esc(e.message)}</p>`;
    return;
  }
  if(sel!==a.id)return;
  const c=d.character||{};
  const info=[["Classe",c.breed],["Sexe",c.sex],["Serveur",c.server],["Guilde",c.guild],["Kamas",c.kamas!=null?c.kamas.toLocaleString("fr-FR"):null]].filter(r=>r[1]);
  const none='<p class="msg">Aucune donnée.</p>', pct=v=>Math.max(0,Math.min(100,+v||0));
  const bar=v=>v!=null?`<div class="bar"><i style="width:${pct(v)}%"></i></div>`:"";
  const tabs={
   fiche:()=>`<div class="card"><h2>${esc(c.name||"Personnage")} ${c.level?`<span class="msg">· niveau ${esc(c.level)}</span>`:""}</h2>${bar(c.xp_pct)}
     ${info.map(r=>`<div class="row"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join("")}</div>
    <div id="boostbox"></div>
    <div class="grid">
     <div class="card"><h2>Caractéristiques</h2>${Object.entries(d.characteristics||{}).map(([g,v])=>`<p class="msg" style="margin:10px 0 2px">${esc(g)}</p>${Object.entries(v).map(([k,x])=>`<div class="row"><span>${esc(k)}</span><span>${esc(x)}</span></div>`).join("")}`).join("")||none}</div>
     <div class="card"><h2>Équipement</h2>${(d.equipment||[]).map(i=>`<div class="slot"><span class="msg">${esc(i.slot)}</span> — ${i.name?`<b>${esc(i.name)}</b>${i.level?` <span class="msg">niv. ${esc(i.level)}</span>`:""}<div class="stats">${(i.stats||[]).map(esc).join(" · ")}</div>`:"<em>vide</em>"}</div>`).join("")||none}</div></div>`,
   inv:()=>{
     const inv=d.inventory||{},items=(inv.items||[]).filter(i=>!invQ||(i.name+" "+(i.type||"")).toLowerCase().includes(invQ.toLowerCase()));
     return `<div class="card"><h2>Inventaire ${inv.items?`<span class="msg">· ${inv.items.length}${inv.capacity?" / "+inv.capacity:""} objets</span>`:""}</h2>
      <input id="invq" placeholder="Filtrer (nom, type)…" value="${esc(invQ)}">
      ${items.length?`<table><tr><th>Objet</th><th>Type</th><th class="n">Niv.</th><th class="n">Qté</th></tr>${items.map(i=>`<tr><td>${esc(i.name)}</td><td class="msg">${esc(i.type)}</td><td class="n">${esc(i.level)}</td><td class="n">${esc((i.qty??1).toLocaleString("fr-FR"))}</td></tr>`).join("")}</table>`:none}</div>`},
   jobs:()=>`<div class="card"><h2>Métiers</h2>${(d.jobs||[]).map(j=>`<div style="margin:10px 0"><div class="row"><span><b style="color:var(--fg)">${esc(j.name)}</b></span><span>niveau ${esc(j.level)}${j.xp!=null?` · ${esc(j.xp)} / ${esc(j.xp_next)} XP`:""}</span></div>${bar(j.xp_pct)}</div>`).join("")||none}</div>`,
   spells:()=>`<div class="card"><h2>Sorts</h2>${(d.spells||[]).length?`<table><tr><th>Sort</th><th>Élément</th><th class="n">Niv.</th><th class="n">PA</th><th>Portée</th><th class="n">Relance</th></tr>${d.spells.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.desc?`<div class="stats">${esc(x.desc)}</div>`:""}</td><td class="msg">${esc(x.element)}</td><td class="n">${esc(x.level)}</td><td class="n">${esc(x.ap)}</td><td>${esc(x.range)}</td><td class="n">${x.cooldown?esc(x.cooldown)+" t.":"—"}</td></tr>`).join("")}</table>`:none}</div>`};
  tabs.combat=()=>'<div id="combat"><p class="msg">Chargement…</p></div>';
  tabs.map=()=>'<div id="curmap"></div><div id="map"></div>';
  tabs.console=()=>consoleHtml(a);
  tabs.quests=()=>'<div id="qv"></div>';
  if(!tabs[tab])tab="fiche";
  $("#char").innerHTML=`<div class="tabs">${[["fiche","Fiche"],["inv","Inventaire"],["jobs","Métiers"],["spells","Sorts"],["combat","Combat"],["map","Map"],["quests","Quêtes"],["console","Console"]].map(t=>`<button class="${t[0]===tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>`+tabs[tab]();
  document.querySelectorAll(".tabs button").forEach(e=>e.onclick=()=>{tab=e.dataset.t;try{localStorage.setItem("tab",tab)}catch{};render()});
  if(tab==="combat")initCombat(a,d);
  if(tab==="map"){initCurMap(a);initMap(a,d)}
  if(tab==="console")initConsole(a);
  if(tab==="quests")refreshQuests(a);
  if(tab==="fiche"&&!a.demo)initBoost(a);
  const q=$("#invq");if(q){q.oninput=()=>{invQ=q.value;const pos=q.selectionStart;render().then(()=>{const n=$("#invq");n&&(n.focus(),n.setSelectionRange(pos,pos))})};}
}
// ---- Game session: status, journal ("Console" tab) ----
const SS={};   // account id -> {st: last /session view, log: [], chat: [], seq}
const STL={connected:"Connecté",connecting:"Connexion…",error:"Erreur",disconnected:"Déconnecté"};
const hms=t=>new Date(t*1000).toLocaleTimeString("fr-FR");
function paintStatus(){
  const a=accts.find(x=>x.id===sel);if(!a||a.demo)return;
  const st=SS[a.id]?.st,v=st?.status||"disconnected";a.session=v;
  const b=$("#st");if(b){b.className="badge "+v;
    b.textContent=(v==="connected"?"● ":v==="connecting"?"◌ ":v==="error"?"✕ ":"○ ")+STL[v]
      +(v==="connected"?` · ${st.character||""}${st.map?" · "+st.map:""} · depuis ${hms(st.since)}`:v==="error"?` : ${st.error}`:"")}
  const c=$("#con");if(c){const on=v==="connected"||v==="connecting";c.textContent=on?"Déconnecter":"Connecter le personnage";c.className=on?"d":"p"}
  const li=document.querySelector(`.acc[data-id="${a.id}"] .ss`);if(li)li.innerHTML=`<span class="dot ${v}"></span>${STL[v]}`;
}
async function pollSession(){
  const a=accts.find(x=>x.id===sel);if(!a||a.demo)return;
  const s=SS[a.id]||(SS[a.id]={st:null,log:[],chat:[],seq:0});
  let v;try{v=await api(`/api/accounts/${a.id}/session?since=${s.seq}`)}catch{return}
  s.st=v;s.seq=v.seq;s.log.push(...v.log);s.chat.push(...v.chat);s.log=s.log.slice(-800);s.chat=s.chat.slice(-400);
  if(sel!==a.id)return;
  paintStatus();if(tab==="console"&&(v.log.length||v.chat.length))appendConsole(v);
  if(tab==="map")refreshCurMap();
  if(tab==="quests")refreshQuests(a);
}
async function toggleSession(a){
  const v=SS[a.id]?.st?.status;
  if(v==="connected"||v==="connecting"){await api(`/api/accounts/${a.id}/disconnect`,"POST",{}).catch(()=>{})}
  else{
    if(!confirm("Ouvrir une session de jeu pour ce compte ? Ferme le vrai jeu avant : une seconde session déconnecte la première."))return;
    try{await api(`/api/accounts/${a.id}/connect`,"POST",{})}catch(e){const m=$("#conmsg");if(m){m.textContent=e.message;m.className="msg err"}return}
  }
  pollSession();
}
const logLine=e=>`<div class="${esc(e.level)}"><span class="t">${hms(e.t)}</span> ${esc(e.msg)}</div>`;
const chatLine=e=>`<div><span class="t">${hms(e.t)}</span> <b>[${esc(e.channel)}]</b> ${esc(e.author)} : ${esc(e.text)}</div>`;
function consoleHtml(a){
  if(a.demo)return '<div class="card"><h2>Console</h2><p class="msg">Le compte de démonstration n\'a pas de session de jeu.</p></div>';
  return `<div class="grid"><div class="card" style="grid-column:1/-1"><h2>Journal <span class="msg">· connexion, actions envoyées, événements</span></h2><div class="cons" id="clog"></div></div>
   <div class="card" style="grid-column:1/-1"><h2>Chat du jeu</h2><div class="cons" id="cchat" style="height:200px"></div>
   <p class="hint">Le chat n'est pas encore décodé : aucun message de chat n'a été enregistré dans les captures. Il s'affichera ici dès que le format sera connu.</p></div></div>`;
}
function initConsole(a){
  if(a.demo)return;const s=SS[a.id]||{log:[],chat:[]};
  const l=$("#clog"),c=$("#cchat");if(l){l.innerHTML=s.log.map(logLine).join("")||'<span class="msg">Aucune activité. Clique sur « Connecter le personnage ».</span>';l.scrollTop=l.scrollHeight}
  if(c){c.innerHTML=s.chat.map(chatLine).join("")||'<span class="msg">Aucun message.</span>'}
}
function appendConsole(v){
  const near=el=>el.scrollHeight-el.scrollTop-el.clientHeight<40;
  const l=$("#clog"),c=$("#cchat");
  if(l&&v.log.length){const stick=near(l);if(!l.querySelector("div"))l.innerHTML="";l.insertAdjacentHTML("beforeend",v.log.map(logLine).join(""));if(stick)l.scrollTop=l.scrollHeight}
  if(c&&v.chat.length){const stick=near(c);if(!c.querySelector("div"))c.innerHTML="";c.insertAdjacentHTML("beforeend",v.chat.map(chatLine).join(""));if(stick)c.scrollTop=c.scrollHeight}
}
setInterval(pollSession,1000);
async function act(fn){
  try{await fn();await loadList()}catch(e){await loadList();const el=$("#acterr");if(el)el.textContent=e.message}
}

let poll=null;
$("#add").onclick=async()=>{
  const label=prompt("Nom du compte (optionnel)","")??null;if(label===null)return;
  try{await api("/api/login","POST",{label});}catch(e){$("#loginmsg").textContent=e.message;return}
  $("#add").disabled=true;$("#loginmsg").textContent="Connexion dans le navigateur ouvert… (ferme le launcher Ankama, port 9001)";
  poll=setInterval(async()=>{
    const s=await api("/api/login");
    if(s.status==="waiting")return;
    clearInterval(poll);$("#add").disabled=false;
    $("#loginmsg").textContent=s.status==="done"?"Compte ajouté.":"Échec : "+s.error;
    $("#loginmsg").className="msg"+(s.status==="error"?" err":"");
    loadList();
  },1500);
};


// ---- Current map: cells, path preview, click to walk, side arrows to change map ----
const CM={id:null,v:null,sel:null,path:null,hover:null,sig:""};
const HW=22,HH=11,CW=14*2*HW+HW,CHT=40*HH+HH;
const cellC=i=>{const r=Math.floor(i/14),c=i%14;return[(c*2+(r%2))*HW+HW,r*HH+HH]};
const cellAt=(px,py)=>{for(let i=0;i<560;i++){const[x,y]=cellC(i);if(Math.abs(px-x)/HW+Math.abs(py-y)/HH<=1)return i}return null};
const SIDES={top:["↑","haut"],left:["←","gauche"],right:["→","droite"],bottom:["↓","bas"]};
function initCurMap(a){
  const box=$("#curmap");if(!box)return;
  if(a.demo){box.innerHTML='<div class="card"><h2>Carte actuelle</h2><p class="msg">Le compte de démonstration n\'a pas de carte en direct.</p></div>';return}
  CM.sig="";box.innerHTML=`<div class="card"><h2 id="cmt">Carte actuelle</h2>
   <div class="mapnav"><span></span><span id="sd-top"></span><span></span><span id="sd-left"></span><canvas id="cv" width="${CW}" height="${CHT}"></canvas><span id="sd-right"></span><span></span><span id="sd-bottom"></span><span></span></div>
   <p class="hint" id="cmi"></p></div><div class="card" id="cmel" style="display:none"></div>`;
  const cv=$("#cv"),pos=e=>{const r=cv.getBoundingClientRect();return cellAt((e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CHT/r.height)};
  cv.onmousemove=e=>{const c=pos(e);if(c!==CM.hover){CM.hover=c;cv.title=c==null?"":"case "+c;drawCurMap()}};
  cv.onmouseleave=()=>{CM.hover=null;drawCurMap()};
  cv.onclick=async e=>{
    const v=CM.v,c=pos(e);if(!v||c==null||!v.mov||v.mov[c]!=="1")return;
    if(CM.sel===c&&CM.path){await moveTo(c);return}
    CM.sel=c;CM.path=null;drawCurMap();
    if(!v.live||v.me==null){setInfo("Connecte le personnage pour calculer un chemin.");return}
    try{const r=await api(`/api/accounts/${sel}/path`,"POST",{to:c});CM.path=r.path}catch(err){CM.path=null;setInfo("Chemin : "+err.message,true);return}
    drawCurMap();
  };
  refreshCurMap();
}
function setInfo(t,bad){const el=$("#cmi");if(el){el.textContent=t;el.className="hint"+(bad?" err":"")}}
async function moveTo(c){
  try{await api(`/api/accounts/${sel}/go`,"POST",{to:c});CM.sel=null;setInfo("Déplacement envoyé…")}catch(err){setInfo("Impossible : "+err.message,true)}
  refreshCurMap();
}
async function changeMap(side){
  try{await api(`/api/accounts/${sel}/changemap`,"POST",{side});setInfo("Changement de carte ("+SIDES[side][1]+")…")}catch(err){setInfo("Impossible : "+err.message,true)}
  refreshCurMap();
}
async function refreshCurMap(){
  const box=$("#curmap");if(!box||!$("#cv"))return;
  let v;try{v=await api(`/api/accounts/${sel}/mapview`)}catch(e){setInfo(e.message,true);return}
  const sig=JSON.stringify([v.map_id,v.me,v.actors,v.busy,v.live,v.elements,v.sides&&Object.values(v.sides).map(s=>s.available)]);

    :CM.path?`Chemin de ${CM.path.length-1} cases vers la case ${CM.sel} : clique à nouveau sur la case pour y aller.`
    :"Clique une case pour calculer le chemin, puis reclique pour y aller. Flèches : changer de carte.");
  drawCurMap();
}
function drawCurMap(){
  const cv=$("#cv"),v=CM.v;if(!cv||!v||!v.mov)return;
  const g=cv.getContext("2d"),css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  g.clearRect(0,0,CW,CHT);
  const exits=new Map();for(const[side,s]of Object.entries(v.sides||{}))for(const c of s.cells)exits.set(c,side);
  const path=new Set(CM.path||[]),dia=(i)=>{const[x,y]=cellC(i);g.beginPath();g.moveTo(x,y-HH);g.lineTo(x+HW,y);g.lineTo(x,y+HH);g.lineTo(x-HW,y);g.closePath()};
  for(let i=0;i<560;i++){
    const walk=v.mov[i]==="1";dia(i);
    g.globalAlpha=1;g.fillStyle=walk?col("--card"):col("--line");if(!walk)g.globalAlpha=.45;g.fill();g.globalAlpha=1;
    if(walk&&exits.has(i)){g.globalAlpha=.3;g.fillStyle=col("--acc");g.fill();g.globalAlpha=1}
    if(path.has(i)){g.globalAlpha=.55;g.fillStyle=col("--acc");g.fill();g.globalAlpha=1}
    g.strokeStyle=col("--line");g.lineWidth=1;g.stroke();
  }
  if(CM.path&&CM.path.length>1){g.beginPath();CM.path.forEach((c,k)=>{const[x,y]=cellC(c);k?g.lineTo(x,y):g.moveTo(x,y)});g.strokeStyle=col("--acc");g.lineWidth=2;g.stroke()}
  for(const e of(v.elements||[])){if(e.cell==null)continue;const[x,y]=cellC(e.cell);g.fillStyle="#d98b1f";g.fillRect(x-4,y-4,8,8)}
  for(const[id,c]of Object.entries(v.actors||{})){const[x,y]=cellC(c);g.beginPath();g.arc(x,y,4,0,7);g.fillStyle=col("--mut");g.fill()}
  for(const c of[CM.sel,CM.hover]){if(c==null)continue;dia(c);g.strokeStyle=col("--fg");g.lineWidth=2;g.stroke()}
  if(v.me!=null){const[x,y]=cellC(v.me);g.beginPath();g.arc(x,y,7,0,7);g.fillStyle=col("--acc");g.fill();g.strokeStyle="#fff";g.lineWidth=2;g.stroke()}
}

// ---- Combat: strategy editor + dry-run simulator (nothing here talks to the game) ----
let aiDraft=null;   // {id,data,dirty}: survives live re-renders so unsaved edits are not lost
const rangeOf=r=>{const m=/(\d+)\s*-\s*(\d+)/.exec(r||"");return m?[+m[1],+m[2]]:[1,1]};
function defaultAI(spells){
  return {move:"approach",rules:[...spells].sort((x,y)=>(y.ap||0)-(x.ap||0)).map(x=>{const [lo,hi]=rangeOf(x.range);
    return {spell:x.name,dmin:lo,dmax:hi,self_hp_below:null,enemy_hp_below:null,max_per_turn:x.cooldown>0?1:null}})};
}
function simulate(ai,spells,st){
  let {pa,pm,dist}=st;const log=[],used={},sp=n=>spells.find(x=>x.name===n);
  const ok=r=>(r.self_hp_below==null||st.selfHp<r.self_hp_below)&&(r.enemy_hp_below==null||st.enemyHp<r.enemy_hp_below);
  const bounds=r=>{const s=sp(r.spell),[lo,hi]=rangeOf(s&&s.range);return [r.dmin??lo,r.dmax??hi]};
  const live=ai.rules.filter(r=>sp(r.spell)&&ok(r));
  if(live.length&&ai.move!=="stay"){
    const hi=Math.max(...live.map(r=>bounds(r)[1])),from=dist;
    while(pm>0&&((ai.move==="approach"&&dist>hi)||(ai.move==="keep_distance"&&dist<hi))){dist+=ai.move==="approach"?-1:1;pm--}
    if(dist!==from)log.push({mv:1,t:`Déplacement : distance ${from} → ${dist} (${st.pm-pm} PM)`});
  }
  for(let n=0;n<60;n++){
    const r=ai.rules.find(r=>{const s=sp(r.spell);if(!s||!ok(r))return false;const [lo,hi]=bounds(r),cap=r.max_per_turn??(s.cooldown>0?1:99);
      return dist>=lo&&dist<=hi&&pa>=Math.max(1,s.ap||0)&&(used[r.spell]||0)<cap});
    if(!r)break;const s=sp(r.spell);pa-=Math.max(1,s.ap||0);used[r.spell]=(used[r.spell]||0)+1;
    log.push({t:`Lance « ${r.spell} » (${s.ap||0} PA, reste ${pa})`});
  }
  if(!log.some(l=>!l.mv))log.push({t:"Aucun sort lançable : la stratégie passerait son tour."});
  log.push({mv:1,t:`Fin de tour : ${pa} PA et ${pm} PM restants, distance ${dist}.`});
  return log;
}
async function initCombat(a,d){
  const box=$("#combat"),spells=d.spells||[];
  if(!aiDraft||aiDraft.id!==a.id){
    try{aiDraft={id:a.id,data:await api(`/api/accounts/${a.id}/ai`),dirty:false}}
    catch(e){aiDraft={id:a.id,data:defaultAI(spells),dirty:true,fresh:true}}
  }
  const sim={pa:12,pm:6,dist:6,selfHp:100,enemyHp:100};let out=null,msg="";
  const num=(k,v,w="")=>`<input type="number" data-k="${k}" value="${v??""}" ${w}>`;
  const draw=()=>{
    const ai=aiDraft.data,names=spells.map(s=>s.name);
    box.innerHTML=`<div class="card"><h2>Stratégie de combat</h2>
     <p class="hint">Règles évaluées dans l'ordre : à chaque lancer, la première règle dont les conditions sont remplies (distance, PV, PA, relance) est utilisée. Ceci est un éditeur et un simulateur : la stratégie n'est pas exécutée en jeu.</p>
     ${spells.length?"":'<p class="err">Aucun sort connu pour ce personnage : les règles ne peuvent référencer que les sorts de l\'onglet Sorts.</p>'}
     <p>Déplacement : <select data-k="move">${[["approach","Se rapprocher de la portée"],["keep_distance","Garder la distance"],["stay","Ne pas bouger"]].map(o=>`<option value="${o[0]}" ${ai.move===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></p>
     <table><tr><th>#</th><th>Sort</th><th>Dist. min</th><th>Dist. max</th><th>Mes PV &lt; %</th><th>PV ennemi &lt; %</th><th>Max/tour</th><th></th></tr>
     ${ai.rules.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td><select data-f="spell">${(names.includes(r.spell)?names:[r.spell,...names]).map(n=>`<option ${n===r.spell?"selected":""}>${esc(n)}</option>`).join("")}</select></td>
       ${["dmin","dmax","self_hp_below","enemy_hp_below","max_per_turn"].map(f=>`<td><input type="number" min="0" data-f="${f}" value="${r[f]??""}"></td>`).join("")}
       <td style="white-space:nowrap"><button data-a="up">↑</button> <button data-a="down">↓</button> <button class="d" data-a="del">✕</button></td></tr>`).join("")}</table>
     <p><button data-a="add" ${spells.length?"":"disabled"}>+ Règle</button> <button data-a="gen" ${spells.length?"":"disabled"}>Générer depuis les sorts</button>
        <button class="p" data-a="save" ${aiDraft.dirty?"":"disabled"}>Enregistrer</button> <span class="msg ${msg.startsWith("Erreur")?"err":""}">${esc(msg)||(aiDraft.dirty?"Modifications non enregistrées":"")}</span></p></div>
     <div class="card"><h2>Simulateur (à blanc)</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${[["pa","PA"],["pm","PM"],["dist","Distance"],["selfHp","Mes PV %"],["enemyHp","PV ennemi %"]].map(f=>`<label class="hint">${f[1]}<br><input type="number" data-s="${f[0]}" value="${sim[f[0]]}" style="width:100%"></label>`).join("")}</div>
      <p><button class="p" data-a="sim">Simuler un tour</button></p>
      ${out?`<ol class="log">${out.map(l=>`<li class="${l.mv?"mv":""}">${esc(l.t)}</li>`).join("")}</ol>`:""}
      <p class="hint">Le simulateur ne calcule pas les dégâts : il montre l'ordre des sorts selon tes PA, PM, la distance et les seuils de PV saisis.</p></div>`;
  };
  const dirty=()=>{aiDraft.dirty=true;msg=""};
  box.onchange=e=>{
    const t=e.target,tr=t.closest("tr[data-i]");
    if(t.dataset.s){sim[t.dataset.s]=+t.value||0;return}
    if(t.dataset.k==="move"){aiDraft.data.move=t.value;dirty();draw();return}
    if(tr&&t.dataset.f){const r=aiDraft.data.rules[+tr.dataset.i];r[t.dataset.f]=t.dataset.f==="spell"?t.value:(t.value===""?null:+t.value);dirty();draw()}
  };
  box.onclick=async e=>{
    const b=e.target.closest("button[data-a]");if(!b)return;
    const act=b.dataset.a,rules=aiDraft.data.rules,tr=b.closest("tr[data-i]"),i=tr?+tr.dataset.i:-1;
    if(act==="add"){const x=spells[0],[lo,hi]=rangeOf(x.range);rules.push({spell:x.name,dmin:lo,dmax:hi,self_hp_below:null,enemy_hp_below:null,max_per_turn:null});dirty()}
    else if(act==="gen"){if(!rules.length||confirm("Remplacer les règles actuelles ?")){aiDraft.data=defaultAI(spells);dirty()}}
    else if(act==="del"){rules.splice(i,1);dirty()}
    else if(act==="up"&&i>0){[rules[i-1],rules[i]]=[rules[i],rules[i-1]];dirty()}
    else if(act==="down"&&i<rules.length-1){[rules[i+1],rules[i]]=[rules[i],rules[i+1]];dirty()}
    else if(act==="sim"){out=simulate(aiDraft.data,spells,sim)}
    else if(act==="save"){
      try{aiDraft.data=await api(`/api/accounts/${a.id}/ai`,"PUT",aiDraft.data);aiDraft.dirty=false;msg="Enregistré."}
      catch(err){msg="Erreur : "+err.message}
    }
    draw();
  };
  draw();
}

// ---- Map: world-grid viewer around the character (view only: the character is never moved) ----
let mapView=null;   // {id,cx,cy,sel,follow}
function initMap(a,d){
  const box=$("#map"),pos=d.position,W=17,H=11,maps=d.maps||[];
  const key=(x,y)=>x+","+y,known=new Map(maps.map(m=>[key(m.x,m.y),m])),trail=new Set((d.trail||[]).map(t=>key(t.x,t.y)));
  if(!mapView||mapView.id!==a.id)mapView={id:a.id,cx:pos?pos.x:0,cy:pos?pos.y:0,sel:pos?{x:pos.x,y:pos.y}:null,follow:true};
  else if(mapView.follow&&pos){mapView.cx=pos.x;mapView.cy=pos.y}   // live: keep following the character
  const draw=()=>{
    const v=mapView,x0=v.cx-(W>>1),y0=v.cy-(H>>1);let cells="";
    cells+='<div class="mc ax"></div>'+Array.from({length:W},(_,i)=>`<div class="mc ax">${x0+i}</div>`).join("");
    for(let j=0;j<H;j++){const y=y0+j;cells+=`<div class="mc ax">${y}</div>`;
      for(let i=0;i<W;i++){const x=x0+i,k=key(x,y),m=known.get(k),me=pos&&pos.x===x&&pos.y===y;
        cells+=`<div class="mc ${me?"me":trail.has(k)?"t":m?"k":""} ${v.sel&&v.sel.x===x&&v.sel.y===y?"sel":""}" data-x="${x}" data-y="${y}" title="${esc(m?m.name:"")}">${me?"●":m?"▪":""}</div>`}}
    const s=v.sel,m=s&&known.get(key(s.x,s.y)),here=s&&pos&&pos.x===s.x&&pos.y===s.y;
    box.innerHTML=`<div class="card"><h2>Carte du monde ${pos?`<span class="msg">· ${esc(pos.world||"")}</span>`:""}</h2>
     ${pos?"":'<p class="msg">Position inconnue : aucun instantané de position pour ce personnage. Tu peux quand même parcourir la grille.</p>'}
     <p><button data-n="-1,0">←</button> <button data-n="1,0">→</button> <button data-n="0,-1">↑</button> <button data-n="0,1">↓</button>
        <button data-n="home" ${pos?"":"disabled"}>Recentrer sur le personnage</button>
        <span class="msg">Vue centrée sur [${v.cx}, ${v.cy}]${v.follow&&pos?" · suit le personnage":""}</span></p>
     <div class="mapwrap" tabindex="0"><div class="mapg" style="grid-template-columns:repeat(${W+1},auto)">${cells}</div></div>
     <p class="hint">● personnage · ▪ map connue · teinte foncée : trajet récent. Clique une case pour la sélectionner ; les flèches du clavier déplacent la vue.
     Visualisation uniquement : le personnage n'est pas déplacé en jeu.</p></div>
     <div class="card"><h2>Map sélectionnée</h2>${s?`<div class="row"><span>Coordonnées</span><span>[${s.x}, ${s.y}]</span></div>
       ${m?`<div class="row"><span>Nom</span><span>${esc(m.name)}</span></div><div class="row"><span>Zone</span><span>${esc(m.area)}</span></div>`:'<p class="msg">Map non renseignée dans les données.</p>'}
       ${here?`<div class="row"><span>Position actuelle</span><span>oui${pos.map_id?" · id "+esc(pos.map_id):""}</span></div>${pos.subarea?`<div class="row"><span>Sous-zone</span><span>${esc(pos.subarea)}</span></div>`:""}${Object.keys(pos.exits||{}).length?`<div class="row"><span>Sorties</span><span>${Object.entries(pos.exits).map(([d,e])=>({right:"→",left:"←",top:"↑",bottom:"↓"}[d]||d)+" ["+esc(e.x)+", "+esc(e.y)+"]").join(" · ")}</span></div>`:""}`:""}
       ${pos&&!here?`<div class="row"><span>Distance du personnage</span><span>${Math.abs(s.x-pos.x)+Math.abs(s.y-pos.y)} maps</span></div>`:""}`:'<p class="msg">Aucune sélection.</p>'}</div>`;
  };
  const pan=(dx,dy)=>{mapView.cx+=dx;mapView.cy+=dy;mapView.follow=false;draw();const w=box.querySelector('.mapwrap');w&&w.focus()};
  box.onclick=e=>{
    const n=e.target.closest("button[data-n]");
    if(n){if(n.dataset.n==="home"){mapView.cx=pos.x;mapView.cy=pos.y;mapView.follow=true;draw()}else{const [dx,dy]=n.dataset.n.split(",").map(Number);pan(dx,dy)}return}
    const c=e.target.closest(".mc[data-x]");if(c){mapView.sel={x:+c.dataset.x,y:+c.dataset.y};draw()}
  };
  box.onkeydown=e=>{const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k){e.preventDefault();pan(...k)}};
  draw();
}
let evT=null;
try{
  const es=new EventSource("/api/events");   // live: reload when accounts or character snapshots change on disk
  es.onmessage=e=>{if(e.data!=="changed")return;clearTimeout(evT);evT=setTimeout(()=>loadList(true).catch(()=>{}),150)};
}catch{}
loadList().catch(e=>$("#main").innerHTML=`<p class="err">${esc(e.message)}</p>`);
</script></body></html>
